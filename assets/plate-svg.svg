<svg width="680" height="112" viewBox="0 0 680 112" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="xSilverline - Systems, AI, GameDev">
  <defs>
    <linearGradient id="header-bg" x1="0" y1="0" x2="680" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111722" />
    </linearGradient>
    <linearGradient id="top-sheen" x1="0" y1="0" x2="680" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#e6edf3" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.035" />
    </pattern>
  </defs>

  <style>
    .handle { font: 700 26px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f0f6fc; letter-spacing: 0.4px; }
    .slash { font: 400 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #484f58; }
    .role { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; letter-spacing: 0.6px; }
    .meta { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; letter-spacing: 1px; }
  </style>

  <rect x="0.5" y="0.5" rx="12" width="679" height="111" fill="url(#header-bg)" stroke="#30363d" />
  <rect x="1" y="1" rx="11.5" width="678" height="110" fill="url(#dot-grid)" />
  <line x1="24" y1="1" x2="656" y2="1" stroke="url(#top-sheen)" stroke-width="1.2" />

  <text x="28" y="54" class="handle">xSilverline <tspan class="slash">//</tspan></text>
  <text x="28" y="80" class="role">Systems · AI Engineering · GameDev</text>

  <circle cx="516" cy="54" r="3" fill="#e6edf3" />
  <text x="528" y="58" class="meta">M.SC. CS @ PWR</text>
  <text x="652" y="80" text-anchor="end" class="meta">CCNA · CAE C1</text>
</svg>