<svg width="680" height="230" viewBox="0 0 680 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Code Telemetry - Most Used Languages">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="680" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111722" />
    </linearGradient>
    <linearGradient id="top-sheen" x1="0" y1="0" x2="680" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#e6edf3" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <pattern id="dot-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.035" />
    </pattern>
  </defs>

  <style>
    .header-title { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f0f6fc; letter-spacing: 1.4px; }
    .header-meta { font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .donut-val { font: 700 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; }
    .donut-lbl { font: 600 9.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; letter-spacing: 1.4px; }
    .lang-name { font: 600 12.5px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e6edf3; }
    .lang-loc { font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6e7681; }
    .lang-pct { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; }
  </style>

  <!-- Tło i ramka -->
  <rect x="0.5" y="0.5" rx="12" width="679" height="229" fill="url(#card-bg)" stroke="#30363d" />
  <rect x="1" y="1" rx="11.5" width="678" height="228" fill="url(#dot-grid)" />
  <line x1="24" y1="1" x2="656" y2="1" stroke="url(#top-sheen)" stroke-width="1.2" />

  <!-- Nagłówek -->
  <circle cx="28" cy="26" r="3" fill="#e6edf3" />
  <text x="40" y="30" class="header-title">CODE TELEMETRY</text>
  <text x="654" y="30" text-anchor="end" class="header-meta">ALL BRANCHES  ·  23 REPOS</text>
  <line x1="24" y1="46" x2="656" y2="46" stroke="#21262d" stroke-width="1" />

  <!-- Lewy panel: Donut Chart -->
  <circle cx="128" cy="138" r="52" fill="none" stroke="#161b22" stroke-width="11" />
  <g>
    <circle cx="128" cy="138" r="52" fill="none" stroke="#f34b7d" stroke-width="11" stroke-dasharray="107.34 219.39" stroke-dashoffset="0.00" transform="rotate(-90 128 138)" /><circle cx="128" cy="138" r="52" fill="none" stroke="#b07219" stroke-width="11" stroke-dasharray="72.53 254.19" stroke-dashoffset="216.89" transform="rotate(-90 128 138)" /><circle cx="128" cy="138" r="52" fill="none" stroke="#3178c6" stroke-width="11" stroke-dasharray="58.60 268.13" stroke-dashoffset="141.85" transform="rotate(-90 128 138)" /><circle cx="128" cy="138" r="52" fill="none" stroke="#555555" stroke-width="11" stroke-dasharray="35.58 291.14" stroke-dashoffset="80.76" transform="rotate(-90 128 138)" /><circle cx="128" cy="138" r="52" fill="none" stroke="#178600" stroke-width="11" stroke-dasharray="23.96 302.77" stroke-dashoffset="42.67" transform="rotate(-90 128 138)" /><circle cx="128" cy="138" r="52" fill="none" stroke="#3572A5" stroke-width="11" stroke-dasharray="6.08 320.65" stroke-dashoffset="16.21" transform="rotate(-90 128 138)" /><circle cx="128" cy="138" r="52" fill="none" stroke="#8b949e" stroke-width="11" stroke-dasharray="5.14 321.59" stroke-dashoffset="7.64" transform="rotate(-90 128 138)" />
  </g>
  <text x="128" y="142" text-anchor="middle" class="donut-val">214</text>
  <text x="128" y="158" text-anchor="middle" class="donut-lbl">COMMITS</text>

  <!-- Separator pionowy -->
  <line x1="248" y1="64" x2="248" y2="206" stroke="#21262d" stroke-width="1" />

  <!-- Prawy panel: Lista języków -->
  <g>
    <g>  <circle cx="278" cy="75.0" r="4" fill="#f34b7d" />  <text x="290" y="79.0" class="lang-name">C++</text>  <rect x="390" y="70.0" width="152" height="6" rx="3" fill="#161b22" />  <rect x="390" y="70.0" width="152.00" height="6" rx="3" fill="#f34b7d" />  <text x="598" y="79.0" text-anchor="end" class="lang-loc">22.8k</text>  <text x="654" y="79.0" text-anchor="end" class="lang-pct">33.6%</text></g><g>  <circle cx="278" cy="96.0" r="4" fill="#b07219" />  <text x="290" y="100.0" class="lang-name">Java</text>  <rect x="390" y="91.0" width="152" height="6" rx="3" fill="#161b22" />  <rect x="390" y="91.0" width="103.84" height="6" rx="3" fill="#b07219" />  <text x="598" y="100.0" text-anchor="end" class="lang-loc">15.5k</text>  <text x="654" y="100.0" text-anchor="end" class="lang-pct">23.0%</text></g><g>  <circle cx="278" cy="117.0" r="4" fill="#3178c6" />  <text x="290" y="121.0" class="lang-name">TypeScript</text>  <rect x="390" y="112.0" width="152" height="6" rx="3" fill="#161b22" />  <rect x="390" y="112.0" width="84.55" height="6" rx="3" fill="#3178c6" />  <text x="598" y="121.0" text-anchor="end" class="lang-loc">12.7k</text>  <text x="654" y="121.0" text-anchor="end" class="lang-pct">18.7%</text></g><g>  <circle cx="278" cy="138.0" r="4" fill="#555555" />  <text x="290" y="142.0" class="lang-name">C</text>  <rect x="390" y="133.0" width="152" height="6" rx="3" fill="#161b22" />  <rect x="390" y="133.0" width="52.70" height="6" rx="3" fill="#555555" />  <text x="598" y="142.0" text-anchor="end" class="lang-loc">7.9k</text>  <text x="654" y="142.0" text-anchor="end" class="lang-pct">11.7%</text></g><g>  <circle cx="278" cy="159.0" r="4" fill="#178600" />  <text x="290" y="163.0" class="lang-name">C#</text>  <rect x="390" y="154.0" width="152" height="6" rx="3" fill="#161b22" />  <rect x="390" y="154.0" width="36.62" height="6" rx="3" fill="#178600" />  <text x="598" y="163.0" text-anchor="end" class="lang-loc">5.5k</text>  <text x="654" y="163.0" text-anchor="end" class="lang-pct">8.1%</text></g><g>  <circle cx="278" cy="180.0" r="4" fill="#3572A5" />  <text x="290" y="184.0" class="lang-name">Python</text>  <rect x="390" y="175.0" width="152" height="6" rx="3" fill="#161b22" />  <rect x="390" y="175.0" width="11.87" height="6" rx="3" fill="#3572A5" />  <text x="598" y="184.0" text-anchor="end" class="lang-loc">1.8k</text>  <text x="654" y="184.0" text-anchor="end" class="lang-pct">2.6%</text></g><g>  <circle cx="278" cy="201.0" r="4" fill="#8b949e" />  <text x="290" y="205.0" class="lang-name">Other</text>  <rect x="390" y="196.0" width="152" height="6" rx="3" fill="#161b22" />  <rect x="390" y="196.0" width="10.57" height="6" rx="3" fill="#8b949e" />  <text x="598" y="205.0" text-anchor="end" class="lang-loc">1.6k</text>  <text x="654" y="205.0" text-anchor="end" class="lang-pct">2.3%</text></g>
  </g>
</svg>
