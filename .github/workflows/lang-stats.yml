name: Update Language Stats (All Branches)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate all-branch language stats SVG
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          AUTHOR_EMAILS: ${{ secrets.AUTHOR_EMAILS }}
          AUTHOR_NAMES: "xSilverline"
          EXTRA_REPOS: ""
          EXCLUDE_REPOS: "xSilverline"
          INCLUDE_FORKS: "false"
          MAX_REPO_SIZE_KB: "500000"
          MAX_LINES_PER_FILE: "3000"
          OUTPUT_PATH: "assets/languages.svg"
        run: python scripts/generate_lang_stats.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update language stats SVG"
            git push
          else
            echo "Brak zmian w assets/languages.svg"
          fi
